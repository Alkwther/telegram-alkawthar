function pinActions(phone){
  const t = directory[phone] || {name: phone}, pin = pins[phone];
  const ov = sheet(`<h3>${esc(t.name)}</h3>
    <div class="kv"><span>رقم الهاتف</span><b dir="ltr">${esc(phone)}</b></div>
    <div class="kv"><span>الرقم السري</span><b style="letter-spacing:3px;font-size:18px">${esc(pin || 'غير مسجل')}</b></div>
    ${pin ? `<button class="opt" data-a="copy">${I.copy}نسخ الرقم السري</button>` : ''}
    <button class="opt" data-a="change">${I.key}تغيير الرقم السري</button>
    <button class="opt" data-a="chat">${I.send}فتح المحادثة</button>`);
  ov.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    const a = b.dataset.a;
    if (a === 'copy'){ try { await navigator.clipboard.writeText(pin); toast('تم النسخ'); } catch(e){ toast('تعذر النسخ'); } ov.remove(); }
    else if (a === 'chat'){ ov.remove(); openChat(phone); }
    else if (a === 'change'){
      ov.querySelector('.sheet').innerHTML = `<h3>رقم سري جديد لـ ${esc(t.name)}</h3>
        <div class="fld"><label>الرقم السري الجديد (4 أرقام أو أكثر)</label><input id="np" inputmode="numeric" dir="ltr" value="${String(Math.floor(1000 + Math.random() * 9000))}"></div>
        <button class="btn" id="npS">حفظ</button><button class="btn sec" id="npC">إلغاء</button><div class="err" id="npE"></div>`;
      ov.querySelector('#npC').onclick = () => ov.remove();
      ov.querySelector('#npS').onclick = async () => {
        const np = ov.querySelector('#np').value.trim();
        if (np.length < 4) return ov.querySelector('#npE').textContent = '4 أرقام على الأقل';
        try {
          await fs.collection('msgr_users').doc(phone).update({pinHash: await sha('kawthar-t|' + phone + '|' + np)});
          await fs.collection('msgr_pins').doc(phone).set({pin: np, name: t.name || '', ts: Date.now()});
          ov.remove(); toast('تم تغيير الرقم السري ✅ أبلغ الأستاذ بالرقم الجديد', 3500);
        } catch(e){ console.error(e); ov.querySelector('#npE').textContent = 'فشل الحفظ، تأكد من الإنترنت'; }
      };
    }
  });
}
async function logout(){
  if (!await askConfirm('تسجيل الخروج؟ تبقى المحادثات محفوظة في هذا الجهاز لهذا الحساب.', 'خروج')) return;
  localStorage.removeItem(LS('session'));
  const tok = localStorage.getItem('ktg_tok_' + myId());
  if (tok && !DEMO){ await fs.collection('msgr_tokens').doc(tok).delete().catch(() => {}); localStorage.removeItem('ktg_tok_' + myId()); }
  if (!DEMO) await auth.signOut().catch(() => {});
  location.reload();
}
async function clearConv(conv){
  stopAudio();
  const ms = await DB.byConv(conv);
  for (const m of ms) await DB.del('msgs', m.id);
  const used = new Set((await DB.all('msgs')).map(m => m.fileKey).filter(Boolean));
  for (const m of ms) if (m.fileKey && !used.has(m.fileKey)){
    await DB.del('files', m.fileKey);
    if (urlCache[m.fileKey]){ URL.revokeObjectURL(urlCache[m.fileKey]); delete urlCache[m.fileKey]; }
  }
  const c = await DB.get('convs', conv);
  if (c){ c.lastText = ''; c.unread = 0; if (S.role === 'press') c.lastTs = 0; await DB.put('convs', c); }
}
async function msgMenu(id){
  const m = await DB.get('msgs', id); if (!m) return;
  const ov = sheet(`
    ${m.text ? `<button class="opt" data-a="copy">${I.copy}نسخ النص</button>` : ''}
    ${m.fileKey ? `<button class="opt" data-a="save">${I.save}حفظ في الجهاز</button>` : ''}
    ${m.fileKey && navigator.canShare ? `<button class="opt" data-a="share">${I.share}مشاركة</button>` : ''}
    ${m.mine && m.status === 'failed' ? `<button class="opt" data-a="retry">${I.send}إعادة الإرسال</button>` : ''}
    <button class="opt" data-a="del" style="color:var(--danger)">${I.trash}حذف</button>`);
  ov.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    ov.remove();
    const a = b.dataset.a;
    if (a === 'copy'){ try { await navigator.clipboard.writeText(m.text); toast('تم النسخ'); } catch(e){ toast('تعذر النسخ'); } }
    else if (a === 'save') (isMobile() ? saveFile : saveFileAs)(m.fileKey, m.name || 'file');
    else if (a === 'share') shareFile(m.fileKey, m.name || 'file');
    else if (a === 'retry') flushOutbox();
    else if (a === 'del') deleteFlow(m);
  });
}
async function showStorage(){
  let used = 0, quota = 0, persisted = false;
  try { const e = await navigator.storage.estimate(); used = e.usage || 0; quota = e.quota || 0; } catch(e){}
  try { persisted = await navigator.storage.persisted(); } catch(e){}
  const msgs = await DB.all('msgs');
  const mineF = msgs.filter(m => m.mine && m.fileKey), gotF = msgs.filter(m => !m.mine && m.fileKey);
  const sum = a => a.reduce((s, m) => s + (m.size || 0), 0);
  const ov = sheet(`<h3>ذاكرة الجهاز</h3>
    <div class="kv"><span>المساحة المستخدمة</span><b>${fmtSize(used)}</b></div>
    <div class="kv"><span>ملفات أرسلتها (${mineF.length})</span><b>${fmtSize(sum(mineF))}</b></div>
    <div class="kv"><span>ملفات حمّلتها (${gotF.length})</span><b>${fmtSize(sum(gotF))}</b></div>
    <div class="kv"><span>عدد الرسائل</span><b>${msgs.length}</b></div>
    <div class="kv"><span>حفظ دائم</span><b>${persisted ? '✅ مفعّل' : '⚠️ غير مفعّل'}</b></div>
    <div class="note">• الملفات التي <b>أرسلتها</b> يجب أن تبقى في جهازك حتى يحمّلها الطرف الآخر.<br>• الملفات التي <b>حمّلتها</b> تقدر تمسحها لتوفير المساحة (بعد حفظها في هاتفك).<br>• لا تمسح بيانات المتصفح حتى لا تضيع المحادثات.</div>
    ${gotF.length ? '<button class="btn sec" id="sD">مسح الملفات المحمّلة من التطبيق</button>' : ''}
    ${persisted ? '' : '<button class="btn" id="sP">تفعيل الحفظ الدائم</button>'}`);
  if (ov.querySelector('#sD')) ov.querySelector('#sD').onclick = async () => {
    ov.remove();
    if (!await askConfirm(`مسح ${gotF.length} ملف محمّل (${fmtSize(sum(gotF))}) من التطبيق؟ تبقى الرسائل، ويمكن إعادة تحميلها إذا كان المرسل ما يزال يحتفظ بها.`, 'مسح')) return;
    for (const m of gotF){
      await DB.del('files', m.fileKey);
      if (urlCache[m.fileKey]){ URL.revokeObjectURL(urlCache[m.fileKey]); delete urlCache[m.fileKey]; }
      m.fileKey = null; m.fileState = 'remote'; await DB.put('msgs', m);
    }
    if (view === 'chat') renderMessages();
    toast('تم المسح');
  };
  if (ov.querySelector('#sP')) ov.querySelector('#sP').onclick = async () => {
    let ok = false; try { ok = await navigator.storage.persist(); } catch(e){}
    toast(ok ? 'تم تفعيل الحفظ الدائم ✅' : 'ثبّت التطبيق على الشاشة الرئيسية ثم حاول مرة أخرى');
    ov.remove();
  };
}
function showSettings(){
  const t = JSON.parse(localStorage.getItem('kmsgr_turn') || 'null') || {};
  const ov = sheet(`<h3>الإعدادات <small style="font-size:12px;color:var(--mut);font-weight:400">نسخة ${APP_VERSION}</small></h3>
    <div style="font-size:14px;color:var(--mut);line-height:1.8;margin-bottom:10px">إذا فشل تحميل الملفات بين جهازين رغم أن الطرفين متصلان، فشبكة الإنترنت تمنع الاتصال المباشر. أضف خادم TURN هنا (أو اطلبه من المطبعة).</div>
    <div class="fld"><label>عنوان TURN</label><input id="tu" dir="ltr" placeholder="turn:server:80" value="${esc(t.urls || '')}"></div>
    <div class="fld"><label>اسم المستخدم</label><input id="tn" dir="ltr" value="${esc(t.username || '')}"></div>
    <div class="fld"><label>كلمة المرور</label><input id="tp" dir="ltr" value="${esc(t.credential || '')}"></div>
    <button class="btn" id="ts">حفظ</button>`);
  ov.querySelector('.sheet h3').insertAdjacentHTML('afterend', `<button class="btn sec" id="stU" style="margin:0 0 12px">🔄 التحقق من وجود تحديث</button>`);
  if (S.role === 'teacher'){ ov.querySelector('#stU').insertAdjacentHTML('beforebegin', `<button class="btn" id="stAd" style="margin:0 0 12px">📍 عنواني (القضاء وأقرب نقطة دالة)</button>`); ov.querySelector('#stAd').onclick = () => { ov.remove(); askAddress(true); }; }
  if (S.role === 'press'){ ov.querySelector('#stU').insertAdjacentHTML('afterend', `<button class="btn" id="stCp" style="margin:0 0 12px">📋 نسخ محتوى ملف (لإعداد الإشعارات)</button>`); ov.querySelector('#stCp').onclick = () => { ov.remove(); copyFileTool(); }; }
  ov.querySelector('#stU').onclick = async () => { ov.remove(); const v = await checkUpdate(true); if (v === APP_VERSION) toast('لديك أحدث نسخة ✅ (' + APP_VERSION + ')'); else if (!v) toast('تعذر التحقق — تأكد من الإنترنت'); };
  ov.querySelector('.sheet h3').insertAdjacentHTML('afterend', `
    <div class="kv" style="align-items:center"><span>🔔 الإشعارات</span><b id="stN" style="color:var(--acc);cursor:pointer">${'Notification' in window ? (Notification.permission === 'granted' ? '✅ مفعّلة' : Notification.permission === 'denied' ? '🚫 مرفوضة' : 'تفعيل') : 'غير مدعومة'}</b></div>
    <div class="kv" style="align-items:center"><span>🔊 صوت الرسائل</span><b id="stS" style="color:var(--acc);cursor:pointer">${soundOn() ? 'تشغيل ✅' : 'مطفأ'}</b></div>
    <button class="kv" id="stTn" style="align-items:center;width:100%;text-align:right"><span>🎵 نغمة وصول الرسائل</span><b style="color:var(--acc)">${esc(sndName('recv'))} ›</b></button>
    <button class="kv" id="sdTn" style="align-items:center;width:100%;text-align:right"><span>📤 صوت إرسال الرسالة</span><b style="color:var(--acc)">${esc(sndName('send'))} ›</b></button>
    <div style="font-size:12.5px;color:var(--mut);margin:6px 0 14px;line-height:1.7">النغمات تعمل والبرنامج مفتوح (تتبع صوت الوسائط). عندما يكون البرنامج مغلقاً يصلك إشعار الهاتف ويتبع وضع الصامت والاهتزاز.</div>`);
  ov.querySelector('#stN').onclick = () => {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'denied') return toast('الإشعارات مرفوضة — فعّلها من إعدادات المتصفح لهذا الموقع', 3500);
    enableNotifications().then(() => { ov.querySelector('#stN').textContent = Notification.permission === 'granted' ? '✅ مفعّلة' : 'تفعيل'; });
  };
  ov.querySelector('#stTn').onclick = () => { ov.remove(); soundPicker('recv', showSettings); };
  ov.querySelector('#sdTn').onclick = () => { ov.remove(); soundPicker('send', showSettings); };
  ov.querySelector('#stS').onclick = () => {
    localStorage.setItem('ktg_sound', soundOn() ? '0' : '1');
    ov.querySelector('#stS').textContent = soundOn() ? 'تشغيل ✅' : 'مطفأ';
    if (soundOn()) playTone();
  };
  ov.querySelector('#ts').onclick = () => {
    const urls = ov.querySelector('#tu').value.trim();
    if (urls) localStorage.setItem('kmsgr_turn', JSON.stringify({urls, username: ov.querySelector('#tn').value.trim(), credential: ov.querySelector('#tp').value.trim()}));
    else localStorage.removeItem('kmsgr_turn');
    ov.remove(); toast('تم الحفظ');
  };
}

/* ---------- الرسالة الجماعية ---------- */
function showBroadcast(){
  const ov = sheet(`<h3>📢 رسالة جماعية</h3>
    <div class="fld"><label>إرسال إلى</label><select id="bProv"><option value="">كل المحافظات</option>${PROVINCES.map(p => `<option>${p}</option>`).join('')}</select></div>
    <div style="font-size:14px;color:var(--mut);margin:-4px 0 10px" id="bCnt"></div>
    <div class="fld"><label>نص الرسالة</label><textarea id="bTxt" rows="4" placeholder="اكتب الإعلان..."></textarea></div>
    <div class="fld"><label>مرفق (اختياري) — يبقى في جهازك ويحمّله كل مدرس منك مباشرة</label><input type="file" id="bFile"></div>
    <button class="btn" id="bGo">إرسال</button>`);
  const targets = () => Object.values(directory).filter(t => !ov.querySelector('#bProv').value || t.province === ov.querySelector('#bProv').value);
  const cnt = () => ov.querySelector('#bCnt').textContent = `سيصل إلى ${targets().length} مدرس`;
  ov.querySelector('#bProv').onchange = cnt; cnt();
  ov.querySelector('#bGo').onclick = async () => {
    const text = ov.querySelector('#bTxt').value.trim();
    let file = ov.querySelector('#bFile').files[0] || null;
    const tg = targets();
    if (!tg.length) return toast('لا يوجد مدرسون');
    if (!text && !file) return toast('اكتب رسالة أو أرفق ملفاً');
    if (!navigator.onLine) return toast('لا يوجد اتصال بالإنترنت');
    const btn = ov.querySelector('#bGo'); btn.disabled = true; btn.textContent = 'جارِ الإرسال...';
    try {
      let fk = null, kind = 'text', mime = '', name = '', size = 0, th = {thumb: null, w: 0, h: 0}, dur = 0;
      if (file){
        if (file.type.startsWith('image/')) file = await compressImage(file);
        fk = uid(); mime = file.type || 'application/octet-stream'; name = file.name || 'file'; size = file.size; kind = kindOf(mime);
        file = new Blob([await file.arrayBuffer()], {type: mime});
        await DB.put('files', file, fk);
        if (kind === 'image') th = await makeThumb(file);
        if (kind === 'audio') dur = await mediaDuration(file);
      }
      let relay = false, chunks = 0, r2 = false;
      const needs = {}; let pend = 0;
      for (const t of tg){ needs[t.phone] = needFor(t.phone); pend += Math.max(1, needs[t.phone].length); }
      if (file && file.size <= RELAY_MAX){ btn.textContent = 'جارِ رفع المرفق...'; ({chunks, r2} = await storeUpload(fk, file, tg.length)); relay = true; }
      const ts = Date.now();
      for (let i = 0; i < tg.length; i += 400){
        const batch = fs.batch(), locals = [];
        for (const t of tg.slice(i, i + 400)){
          const id = uid();
          const data = {conv: t.phone, from: 'press', to: t.phone, kind, text, name, mime, size, ts, rid: fk, thumb: th.thumb, w: th.w, h: th.h, dur, relay, chunks, r2};
          batch.set(fs.collection('msgr_queue').doc(id), {...data, need: needs[t.phone], got: [], dev: devId()});
          locals.push({...data, id, status: 'sent', mine: true, fileKey: fk});
        }
        await batch.commit();
        notifyPush(locals.map(x => x.id));
        for (const m of locals){ await DB.put('msgs', m); await touchConv(m.conv, m, false); }
      }
      toast(`تم الإرسال إلى ${tg.length} مدرس ✅`);
      ov.remove();
    } catch(e){
      console.error(e); toast('فشل الإرسال، تأكد من الإنترنت');
      btn.disabled = false; btn.textContent = 'إرسال';
    }
  };
}

init();
